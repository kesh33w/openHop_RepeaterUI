name: CI

on:
  pull_request:
  push:
    branches: [kesh/bridge]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI
        uses: actions/checkout@v4
        with:
          path: openHop_RepeaterUI

      # The API client is generated from the repeater's OpenAPI spec.
      - name: Checkout matching repeater
        uses: actions/checkout@v4
        with:
          repository: kesh33w/openhop_repeater
          ref: kesh/bridge
          path: openhop_repeater

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openHop_RepeaterUI/package-lock.json

      - name: Install
        working-directory: openHop_RepeaterUI
        run: npm ci

      - name: API client matches repeater spec
        working-directory: openHop_RepeaterUI
        run: npm run api:check

      - name: Type-check
        working-directory: openHop_RepeaterUI
        run: npx vue-tsc --build

      - name: Unit tests
        working-directory: openHop_RepeaterUI
        run: npx vitest run --maxWorkers=2

      - name: Production build
        working-directory: openHop_RepeaterUI
        run: npx vite build --outDir dist
